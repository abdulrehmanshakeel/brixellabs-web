# BrixelLabs Enterprise Nginx Reverse Proxy Load Balancer Configuration
# Architecture: Upstream Round-Robin / Least-Connections Cluster with Dynamic Health Checking

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & Buffers
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for High-Throughput API Payload Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Upstream Distributed Backend Cluster (Django / Gunicorn Workers)
    upstream brixel_backend_cluster {
        # Balancing Algorithm: Least-Connections (routes to least busy server)
        least_conn;

        # Primary Cluster Worker Nodes
        server 127.0.0.1:8001 weight=3 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 weight=3 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 weight=3 max_fails=3 fail_timeout=10s;

        # Warm Keepalive Connections to avoid TCP Handshake Overhead
        keepalive 64;
    }

    # Upload Body Size Limit (Defends against memory exhaustion and buffer overflows)
    client_max_body_size 10M;

    # Rate Limiting Zones (DDoS and Abuse Prevention)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=inquiry_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name brixellabs.com www.brixellabs.com;

        # Enforce HTTPS Redirect
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name brixellabs.com www.brixellabs.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/brixellabs.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/brixellabs.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http://127.0.0.1:8000 http://localhost:8000 https://challenges.cloudflare.com https://www.google-analytics.com; frame-src 'self' https://challenges.cloudflare.com https://calendly.com; object-src 'none'; base-uri 'self';" always;

        # Load Balancer Diagnostic Telemetry Headers
        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Response-Time $upstream_response_time always;

        # Root static frontend routing
        location / {
            root /var/www/brixellabs/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Browser Cache for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Distributed API Routing through Upstream Cluster
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://brixel_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy Buffer Settings for High Throughput
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Dynamic Failover handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Dedicated Rate-Limited Route for Public Consultation Submissions
        location /api/inquiries/ {
            limit_req zone=inquiry_limit burst=5 nodelay;

            proxy_pass http://brixel_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Protected User-Uploaded Media Storage
        location /media/ {
            alias /var/www/brixellabs/media/;
            autoindex off;

            # Strictly block all script execution (PHP, Python, Shell, Perl, CGI, Executables, HTML, SVG)
            location ~* \.(php\d?|phtml|py|sh|bash|exe|dll|bat|cmd|ps1|vbs|js|cgi|pl|jsp|asp|aspx|shtml|svg|xml|html|htm)$ {
                deny all;
                return 404;
            }

            # Enforce MIME type integrity, safe download headers, and CSP sandbox
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        }

        # Load Balancer Health Monitoring Probe
        location /lb-health {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"active"}\n';
            add_header Content-Type application/json;
        }
    }
}
