version: '3.8'

services:
  # 1. Reverse Proxy & Distributed Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: brixel_load_balancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/load_balancer.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/var/www/brixellabs/dist:ro
    depends_on:
      - backend_worker_1
      - backend_worker_2
      - backend_worker_3
    restart: always

  # 2. Redis High-Speed In-Memory Cache Layer
  redis_cache:
    image: redis:7-alpine
    container_name: brixel_redis_cache
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 3. Distributed Backend Worker Node 1
  backend_worker_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brixel_backend_worker_1
    environment:
      - PORT=8001
      - REDIS_URL=redis://redis_cache:6379/0
      - DJANGO_SETTINGS_MODULE=brixellabs_backend.settings
    expose:
      - "8001"
    depends_on:
      - redis_cache
    restart: always

  # 4. Distributed Backend Worker Node 2
  backend_worker_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brixel_backend_worker_2
    environment:
      - PORT=8002
      - REDIS_URL=redis://redis_cache:6379/0
      - DJANGO_SETTINGS_MODULE=brixellabs_backend.settings
    expose:
      - "8002"
    depends_on:
      - redis_cache
    restart: always

  # 5. Distributed Backend Worker Node 3
  backend_worker_3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brixel_backend_worker_3
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis_cache:6379/0
      - DJANGO_SETTINGS_MODULE=brixellabs_backend.settings
    expose:
      - "8003"
    depends_on:
      - redis_cache
    restart: always

volumes:
  redis_data:
