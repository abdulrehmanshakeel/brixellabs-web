<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>404 - Page Not Found | BrixelLabs</title>
  <meta name="description" content="The requested page could not be found. Explore BrixelLabs custom AI models, high-performance web development, and enterprise engineering solutions." />
  <meta name="robots" content="noindex, follow" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #02070f;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(3, 14, 26, 0) 70%);
      pointer-events-none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 10;
      max-width: 680px;
      width: 100%;
      background: rgba(3, 14, 26, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 240, 255, 0.1);
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #ffffff;
      margin-bottom: 2rem;
      transition: transform 0.2s ease;
    }
    .logo-container:hover {
      transform: scale(1.03);
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #0f172a, #071929);
      border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }
    .logo-badge img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-highlight {
      color: #00f0ff;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
      margin-bottom: 0.75rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 480px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      border-top-color: #00f0ff;
      color: #00f0ff;
    }
    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #00f0ff;
      color: #02070f;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
    }
    .primary-btn:hover {
      background: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.55);
    }
    .footer-help {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .footer-help a {
      color: #00f0ff;
      text-decoration: none;
    }
    .footer-help a:hover {
      text-decoration: underline;
    }
    @media (max-width: 640px) {
      .card {
        padding: 2rem 1.25rem;
      }
      .error-code {
        font-size: 4rem;
      }
      .links-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <main class="card">
    <a href="/" class="logo-container" title="Return to BrixelLabs Home">
      <div class="logo-badge">
        <img src="/favicon.png" alt="BrixelLabs Logo" width="26" height="26" />
      </div>
      <div class="brand-title">
        Brixel<span class="brand-highlight">Labs</span>
      </div>
    </a>

    <div class="error-code">404</div>
    <h1 class="error-title">System Node Unreachable</h1>
    <p class="error-desc">
      The requested route or module is inactive or has been moved. Explore our active engineering modules below:
    </p>

    <div class="links-grid">
      <a href="/" class="nav-btn">
        <span>Overview</span>
      </a>
      <a href="/services" class="nav-btn">
        <span>Services</span>
      </a>
      <a href="/case-studies" class="nav-btn">
        <span>Case Studies</span>
      </a>
      <a href="/contact" class="nav-btn">
        <span>Contact</span>
      </a>
    </div>

    <div>
      <a href="/" class="primary-btn">
        <span>Return to Homepage</span>
        <span>→</span>
      </a>
    </div>

    <div class="footer-help">
      Need direct assistance? Call <a href="tel:+923449254864">+92 344 9254864</a> or email <a href="mailto:brixellabs@gmail.com">brixellabs@gmail.com</a>
    </div>
  </main>
</body>
</html>
